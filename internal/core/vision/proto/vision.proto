syntax = "proto3";

package vision;

option go_package = "FreshBox/internal/core/vision/proto";

// 图像识别服务
service VisionService {
  // 检测商品
  rpc DetectProduct(DetectRequest) returns (DetectResponse) {}
  // 提取元数据
  rpc ExtractMetadata(MetadataRequest) returns (MetadataResponse) {}
}

// 检测请求
message DetectRequest {
  bytes image_data = 1;
  double threshold = 2;
}

// 检测响应
message DetectResponse {
  string product_name = 1;
  string expiry_date = 2;
  double confidence = 3;
  BoundingBox bounding_box = 4;
  string classification = 5;
}

// 元数据请求
message MetadataRequest {
  bytes image_data = 1;
}

// 元数据响应
message MetadataResponse {
  string capture_time = 1;
  string device = 2;
  string format = 3;
  Location location = 4;
}

// 地理位置信息
message Location {
  double latitude = 1;
  double longitude = 2;
}

message BoundingBox {
  double x = 1;
  double y = 2;
  double width = 3;
  double height = 4;
} 