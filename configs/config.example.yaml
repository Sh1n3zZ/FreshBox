app:
  name: FreshBox
  mode: development
  port: 8080
  version: "0.0.1"

cors:
  allow_origin: "http://localhost:5173"
  allow_credentials: true
  max_age: 12

mysql:
  host: localhost
  port: 3306
  username: root
  password: root
  database: freshbox
  max_idle_conns: 10
  max_open_conns: 100

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0

vision:
  grpc:
    host: localhost
    port: 50051
    timeout: 5s
  openai:
    api_key: "your-openai-api-key"
    endpoint: "https://api.openai.com/v1"
    model: "gpt-4o"
    max_tokens: 1000
    timeout_sec: 30
    ocr_summary_model: "deepseek-v3"
    summary_cache_minutes: 30
    ocr_summary_prompt: |
      You are a professional food-related information extraction assistant. Please extract the following information from the given text and return it in JSON format: product name, product description, product price, shelf life, production date, manufacturer, production lot number, storage conditions, ingredient list. If an item of information does not exist, an empty string is returned.
      Your response should always be returned in the following format, if I give you text where an item does not exist, please leave it blank:
      {
        "product_name": "",
        "product_description": "",
        "product_price": "",
        "product_shelf_life": "",
        "product_production_date": "",
        "product_manufacturer": "",
        "product_production_batch_number": "",
        "product_storage_conditions": "",
        "product_ingredients": [{
          "index": 1,
          "ingredients": ""
        },
        {
          "index": 2,
          "ingredients": ""
        }
        ]
      }
    dashboard_summary_prompt: |
      你是一位专业的数据分析助手，请分析提供的FreshBox平台仪表盘数据，并提供有用的业务见解和建议。

      请根据以下数据：
      1. 当前统计数据（销售额、盲盒总数、用户总数、捐赠总额等）
      2. 近期用户活动

      生成一个简短的业务状况总结，并提供关键洞察和行动建议。

      返回的JSON格式必须如下：
      {
        "summary": "对当前业务状况的简洁总结",
        "insights": [
          "关键洞察点1",
          "关键洞察点2",
          "关键洞察点3"
        ],
        "recommendations": [
          "具体建议1",
          "具体建议2",
          "具体建议3"
        ]
      }

blockchain:
  polygon:
    rpc_url: "https://polygon-rpc.com"
    contract_address: ""
    private_key: ""

smtp:
  host: "smtp.example.com"
  port: 587
  username: "your-email@example.com"
  password: "your-password"
  from_email: "noreply@freshbox.com"
  from_name: "FreshBox"
  verification_subject: "FreshBox 验证码"
  verification_expire_minutes: 10

jwt:
  secret: "your-secret-key"
  expire_hours: 24

log:
  level: debug
  filename: "./logs/app.log"
  max_size: 100
  max_age: 7
  max_backups: 10
