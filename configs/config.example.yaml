app:
  name: FreshBox
  mode: development
  port: 8080
  version: "0.0.1"

cors:
  allow_origin: "http://localhost:3000"
  allow_credentials: true
  max_age: 12

mysql:
  host: localhost
  port: 3306
  username: root
  password: root
  database: freshbox
  max_idle_conns: 10
  max_open_conns: 100

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0

vision:
  grpc:
    host: localhost
    port: 50051
    timeout: 5s
  openai:
    api_key: "your-openai-api-key"
    endpoint: "https://api.openai.com/v1"
    model: "gpt-4o"
    max_tokens: 1000
    timeout_sec: 30

blockchain:
  polygon:
    rpc_url: "https://polygon-rpc.com"
    contract_address: ""
    private_key: ""

smtp:
  host: "smtp.example.com"
  port: 587
  username: "your-email@example.com"
  password: "your-password"
  from_email: "noreply@freshbox.com"
  from_name: "FreshBox"
  verification_subject: "FreshBox 验证码"
  verification_expire_minutes: 10

jwt:
  secret: "your-secret-key"
  expire_hours: 24

log:
  level: debug
  filename: "./logs/app.log"
  max_size: 100
  max_age: 7
  max_backups: 10 